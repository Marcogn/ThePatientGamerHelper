# .github/workflows/build-apk.yml
name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Make gradlew eseguibile
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon
        env:
          DRIVE_OAUTH_WEB_CLIENT_ID: ${{ secrets.DRIVE_OAUTH_WEB_CLIENT_ID }}

      # The runner's debug keystore is freshly generated per run (not a fixed value shared with
      # any developer machine), so its SHA-1 must be read off this specific build if the Android
      # OAuth client in Google Cloud Console (Sign in with Google) needs registering/updating for
      # this exact APK — see CLAUDE.md, "Phase 4" section, "Account reauth failed" note.
      - name: Print debug keystore SHA-1 (for Google OAuth Android client setup)
        run: ./gradlew signingReport --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
