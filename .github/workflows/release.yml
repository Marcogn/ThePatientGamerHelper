# Release (manual): cuts CHANGELOG.md's [Unreleased] section, bumps the version, builds and signs,
# publishes the GitHub Release and commits the bump to main; then, only if all that succeeded,
# deletes the old workflow runs (all but Release and the latest successful Build APK). The version is the current one with `bump` applied
# (minor by default: 1.4.2 -> 1.5.0), or the exact one typed in `version`. Logic in the kit (its
# docs/ci.md explains every step); here only this project's values.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Part of the current version to increase (minor: 1.4.2 -> 1.5.0, patch: 1.4.3, major: 2.0.0)'
        type: choice
        options: [minor, patch, major]
        default: minor
      version:
        description: 'Optional exact version x.y.z, overrides the choice above (must be greater than the current one)'
        required: false
        type: string

permissions:
  contents: write   # version bump and Release
  actions: write    # deleting the old runs

jobs:
  release:
    uses: Marcogn/claude-skill-android-kit/.github/workflows/release.yml@v1
    with:
      version: ${{ inputs.version }}
      bump: ${{ inputs.bump }}
      app-module: app
      java-version: '17'
    secrets:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
      # The Drive OAuth web client id the build bakes into the APK (app/build.gradle.kts).
      BUILD_ENV: "DRIVE_OAUTH_WEB_CLIENT_ID=${{ secrets.DRIVE_OAUTH_WEB_CLIENT_ID }}"
