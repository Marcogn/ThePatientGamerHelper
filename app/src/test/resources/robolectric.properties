# Every Robolectric test runs with a plain Application, not ThePatientGamerHelperApplication:
# its onCreate() starts background jobs on Dispatchers.Default (debug seed, orphaned-cover pruning
# then cover recompression, APK leftover cleanup) that race with tests using the same files/cache
# dirs; the pruning deletes any cover no review/backlog item references, i.e. a test's fresh cover.
# No test needs the Hilt application (they build their objects by hand).
application=android.app.Application
